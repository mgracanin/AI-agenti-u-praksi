name: Temporary DOCX update and QA

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-and-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/update-unified-guide-oauth
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install DOCX tooling
        run: |
          python -m pip install --disable-pip-version-check python-docx==1.1.2
          if ! command -v libreoffice >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y libreoffice-writer poppler-utils
          fi
      - name: Update unified guide
        shell: bash
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from docx import Document
          from docx.oxml.ns import qn
          from pathlib import Path

          path = Path('AI-agenti-u-praksi-unificirani-vodic.docx')
          doc = Document(path)

          def clean(text):
              return ' '.join(text.split())

          def find_paragraph(exact):
              for p in doc.paragraphs:
                  if clean(p.text) == exact:
                      return p
              raise RuntimeError(f'Paragraph not found: {exact}')

          # Update verification date and the quick-start pointer.
          for p in doc.paragraphs:
              if clean(p.text).startswith('Provjereno:'):
                  p.text = 'Provjereno: 21. kolovoza 2026. | Jezik: hrvatski'
                  break
          else:
              raise RuntimeError('Verification date paragraph not found')

          for p in doc.paragraphs:
              if clean(p.text) == 'Dodajte credentials.json i upišite OPENAI_API_KEY u .env.':
                  p.text = ('Dodajte credentials.json prema detaljnom postupku u odjeljku 4.2 '
                            'i upišite OPENAI_API_KEY u .env.')
                  break
          else:
              raise RuntimeError('Windows quick-start credentials paragraph not found')

          # Replace the short 4.2 section, preserving the heading and the next heading.
          h42 = find_paragraph('4.2 Google Cloud: Desktop OAuth')
          h43 = find_paragraph('4.3 Instalacija — Linux ili macOS')
          body = doc._element.body
          start = list(body).index(h42._element)
          end = list(body).index(h43._element)
          for el in list(body)[start + 1:end]:
              body.remove(el)

          entries = [
              ('Normal', '`credentials.json` nije Gmail lozinka niti korisnički OAuth token. To je JSON datoteka s identitetom OAuth klijenta (`client_id` i `client_secret`) koji izradite u Google Cloudu. Korisnik se zasebno prijavljuje u Google i odobrava pristup Gmailu.'),
              ('List Number', 'Otvorite Google Cloud Console, izradite novi projekt ili odaberite postojeći projekt namijenjen ovom agentu, a zatim u APIs & Services → Library uključite Gmail API.'),
              ('List Number', 'U Google Auth Platform → Branding postavite barem App name, User support email i Developer contact information.'),
              ('List Number', 'U Google Auth Platform → Audience za osobni Gmail račun odaberite External. Za Google Workspace projekt koji koriste samo članovi iste organizacije možete odabrati Internal, ako je ta mogućnost dostupna.'),
              ('List Number', 'Ako koristite External i aplikacija je u statusu Testing, u Audience → Test users dodajte Gmail račun kojim ćete pokretati agenta. Bez toga autorizacija testnog korisnika može biti odbijena.'),
              ('List Number', 'U Google Auth Platform → Data Access dodajte scopeove koje ova implementacija traži:'),
              ('Code', 'https://www.googleapis.com/auth/gmail.modify\nhttps://www.googleapis.com/auth/gmail.compose'),
              ('Normal', 'Google oba scopea klasificira kao Restricted. gmail.modify omogućuje čitanje i izmjenu poruka, a gmail.compose upravljanje skicama. Scope compose tehnički dopušta i slanje, ali ovaj projekt namjerno nema metodu koja poziva Gmail API za slanje poruke.'),
              ('List Number', 'Otvorite Google Auth Platform → Clients → Create Client, odaberite Application type: Desktop app i zadajte prepoznatljiv naziv, primjerice AI Inbox Agent Windows.'),
              ('Normal', 'Za Desktop app ne upisujete ručno redirect URI. Kod koristi InstalledAppFlow.run_local_server(port=0), pa pri prvom pokretanju otvara privremeni lokalni HTTP callback na slobodnom portu i zatim zadani web-preglednik.'),
              ('List Number', 'Preuzmite JSON OAuth klijenta, preimenujte ga u credentials.json i kopirajte izravno u mapu inbox-agent.'),
              ('Code', 'inbox-agent\\\n  credentials.json\n  .env\n  run-windows.ps1\n  setup-windows.ps1\n  register-task-windows.ps1'),
              ('Callout', 'Tajne. credentials.json, .env i .data/token.json ne smiju u Git. Projektni .gitignore ih već isključuje, ali prije commita svejedno provjerite git status.'),
              ('List Number', 'Prvo interaktivno pokretanje napravite s .\\run-windows.ps1. To je dry-run. Ako .data/token.json još ne postoji, otvorit će se preglednik; prijavite se Gmail računom iz Test users, pregledajte dozvole i potvrdite pristup.'),
              ('Normal', 'Nakon uspješne autorizacije aplikacija sprema korisnički OAuth token u inbox-agent\\.data\\token.json. Pri kasnijim pokretanjima koristi refresh token i po potrebi automatski obnavlja kratkotrajni access token.'),
              ('Callout', 'External + Testing. Google za External OAuth projekt u statusu Testing, kada se traže Gmail scopeovi izvan osnovnih openid/profile/email scopeova, u pravilu izdaje refresh token koji istječe nakon 7 dana. To je važno za Scheduled Task: nakon isteka potrebno je ponovno interaktivno autorizirati račun ili urediti publishing/verifikacijski status aplikacije u skladu s Googleovim pravilima.'),
              ('List Number', 'Izbrišite .data/token.json i ponovite OAuth autorizaciju ako promijenite credentials.json odnosno OAuth Client ID, promijenite tražene scopeove, želite koristiti drugi Gmail račun ili Google vrati invalid_grant / korisnik opozove pristup.'),
              ('Normal', 'credentials.json i token.json nisu isto: prvi identificira vašu aplikaciju, a drugi predstavlja odobrenje konkretnog Gmail korisnika. token.json nemojte kopirati na druga računala niti dijeliti s drugim korisnicima.'),
          ]
          for style, text in entries:
              h43.insert_paragraph_before(text, style=style)

          # Add official Gmail/OAuth sources if they are not already present.
          h73 = find_paragraph('7.3 Isporučene datoteke')
          existing = {clean(p.text) for p in doc.paragraphs}
          sources = [
              'Google Workspace: Gmail API Python quickstart — https://developers.google.com/workspace/gmail/api/quickstart/python',
              'Gmail API: OAuth scopeovi — https://developers.google.com/workspace/gmail/api/auth/scopes',
              'Google Identity: OAuth 2.0 i istek refresh tokena — https://developers.google.com/identity/protocols/oauth2#expiration',
          ]
          for source in sources:
              if source not in existing:
                  h73.insert_paragraph_before(source, style='List Bullet')

          # Ask Word/LibreOffice to refresh fields such as a TOC when the document opens.
          settings = doc.settings._element
          update = settings.find(qn('w:updateFields'))
          if update is None:
              update = settings.makeelement(qn('w:updateFields'), {qn('w:val'): 'true'})
              settings.append(update)
          else:
              update.set(qn('w:val'), 'true')

          doc.core_properties.modified = datetime.now(timezone.utc)
          doc.save(path)
          print(f'Updated {path}')
          PY
      - name: Render DOCX for visual QA
        shell: bash
        run: |
          rm -rf qa && mkdir -p qa/pages
          libreoffice --headless --convert-to pdf --outdir qa AI-agenti-u-praksi-unificirani-vodic.docx
          test -s qa/AI-agenti-u-praksi-unificirani-vodic.pdf
          pdftoppm -png -r 120 qa/AI-agenti-u-praksi-unificirani-vodic.pdf qa/pages/page
          test "$(find qa/pages -name '*.png' | wc -l)" -gt 0
          echo "Rendered $(find qa/pages -name '*.png' | wc -l) pages."
      - name: Upload DOCX QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: unified-guide-docx-qa
          path: |
            AI-agenti-u-praksi-unificirani-vodic.docx
            qa/AI-agenti-u-praksi-unificirani-vodic.pdf
            qa/pages/*.png
          if-no-files-found: error
          retention-days: 7
      - name: Commit updated DOCX to PR branch
        shell: bash
        run: |
          git config user.name 'OpenAI ChatGPT'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AI-agenti-u-praksi-unificirani-vodic.docx
          if git diff --cached --quiet; then
            echo 'DOCX already up to date.'
          else
            git commit -m 'Update unified guide with Gmail OAuth instructions'
            git push origin HEAD:docs/update-unified-guide-oauth
          fi
