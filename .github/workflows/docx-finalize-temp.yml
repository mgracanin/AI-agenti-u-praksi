name: One-shot DOCX finalization

on:
  push:
    branches:
      - docs/update-unified-guide-oauth

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/update-unified-guide-oauth
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install python-docx
        run: python -m pip install --disable-pip-version-check python-docx==1.2.0
      - name: Apply final formatting and link fixes
        shell: bash
        run: |
          python - <<'PY'
          from copy import deepcopy
          from pathlib import Path
          from docx import Document
          from docx.oxml import OxmlElement
          from docx.oxml.ns import qn

          path = Path('AI-agenti-u-praksi-unificirani-vodic.docx')
          doc = Document(path)

          code_template = next(p for p in doc.paragraphs if p.style.name == 'Code' and 'python -m pytest -q' in p.text)
          callout_template = next(p for p in doc.paragraphs if p.style.name == 'Callout' and p.text.startswith('Rollback.'))

          for p in doc.paragraphs:
              if p.text.startswith('`credentials.json` nije Gmail lozinka'):
                  p.text = p.text.replace('`credentials.json`', 'credentials.json').replace('`client_id`', 'client_id').replace('`client_secret`', 'client_secret')
                  p.style = doc.styles['Normal']
                  break
          else:
              raise RuntimeError('OAuth introductory paragraph not found')

          for p in doc.paragraphs:
              if p.style.name == 'Code' and (p.text.startswith('https://www.googleapis.com/auth/gmail.modify') or p.text.startswith('inbox-agent\\')):
                  old = p._p.pPr
                  if old is not None:
                      p._p.remove(old)
                  p._p.insert(0, deepcopy(code_template._p.pPr))

          for prefix in ('Tajne.', 'External + Testing.'):
              p = next((p for p in doc.paragraphs if p.style.name == 'Callout' and p.text.startswith(prefix)), None)
              if p is None:
                  raise RuntimeError(f'Callout not found: {prefix}')
              text = p.text
              old = p._p.pPr
              if old is not None:
                  p._p.remove(old)
              p._p.insert(0, deepcopy(callout_template._p.pPr))
              for r in list(p.runs):
                  p._p.remove(r._r)
              lead, rest = text.split(' ', 1)
              r1 = p.add_run(lead + ' ')
              r1.bold = True
              p.add_run(rest)

          def add_hyperlink(paragraph, text, url):
              rid = paragraph.part.relate_to(url, 'http://schemas.openxmlformats.org/officeDocument/2006/relationships/hyperlink', is_external=True)
              hyperlink = OxmlElement('w:hyperlink')
              hyperlink.set(qn('r:id'), rid)
              run = OxmlElement('w:r')
              rpr = OxmlElement('w:rPr')
              color = OxmlElement('w:color'); color.set(qn('w:val'), '0563C1')
              underline = OxmlElement('w:u'); underline.set(qn('w:val'), 'single')
              rpr.append(color); rpr.append(underline); run.append(rpr)
              t = OxmlElement('w:t'); t.text = text; run.append(t)
              hyperlink.append(run); paragraph._p.append(hyperlink)

          sources = {
              'Google Workspace: Gmail API Python quickstart —': 'https://developers.google.com/workspace/gmail/api/quickstart/python',
              'Gmail API: OAuth scopeovi —': 'https://developers.google.com/workspace/gmail/api/auth/scopes',
              'Google Identity: OAuth 2.0 i istek refresh tokena —': 'https://developers.google.com/identity/protocols/oauth2#expiration',
          }
          for p in doc.paragraphs:
              text = ' '.join(p.text.split())
              for label, url in sources.items():
                  if text.startswith(label):
                      for child in list(p._p):
                          if child.tag != qn('w:pPr'):
                              p._p.remove(child)
                      p.add_run(label + ' ')
                      add_hyperlink(p, url, url)
                      break

          doc.save(path)
          # Re-open to ensure the package remains a valid DOCX.
          check = Document(path)
          assert any(p.text.startswith('credentials.json nije Gmail lozinka') for p in check.paragraphs)
          assert any('https://www.googleapis.com/auth/gmail.modify' in p.text for p in check.paragraphs)
          print(f'Finalized {path}: {len(check.paragraphs)} paragraphs')
          PY
      - name: Upload final DOCX artifact
        uses: actions/upload-artifact@v4
        with:
          name: unified-guide-final-docx
          path: AI-agenti-u-praksi-unificirani-vodic.docx
          if-no-files-found: error
          retention-days: 7
      - name: Commit final DOCX and remove this workflow
        shell: bash
        run: |
          git config user.name 'OpenAI ChatGPT'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AI-agenti-u-praksi-unificirani-vodic.docx
          git rm .github/workflows/docx-finalize-temp.yml
          git commit -m 'Finalize Gmail OAuth guide formatting'
          git push origin HEAD:docs/update-unified-guide-oauth
